<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Cyberpunk Edition</title>
    <!-- Tailwind CSS for UI layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Retro/Arcade Look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- FontAwesome for Controls Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Tstyle.css">
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-2 md:p-6 bg-slate-950 relative overflow-y-auto">

    <!-- Scanline Effect Overlay -->
    <div class="fixed inset-0 scanlines z-50 pointer-events-none"></div>

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-2 md:mb-4 z-10 px-2">
        <div class="flex items-center gap-2">
            <h1 class="text-2xl md:text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-pink-500 glow-cyan">
                TETRIS
            </h1>
            <span class="text-xs px-2 py-0.5 rounded bg-fuchsia-900/50 text-fuchsia-300 border border-fuchsia-500 font-bold">CYBER</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="soundToggleBtn" class="px-3 py-1.5 rounded-lg border border-cyan-500/50 text-cyan-400 hover:bg-cyan-950/50 transition flex items-center gap-2 text-sm">
                <i id="soundIcon" class="fas fa-volume-up"></i>
            </button>
            <button id="pauseBtn" class="px-3 py-1.5 rounded-lg border border-pink-500/50 text-pink-400 hover:bg-pink-950/50 transition flex items-center gap-2 text-sm font-semibold">
                <i id="pauseIcon" class="fas fa-pause"></i> <span id="pauseBtnText" class="hidden sm:inline">PAUSA</span>
            </button>
        </div>
    </header>

    <!-- Main Game Workspace -->
    <main class="w-full max-w-4xl flex flex-col md:flex-row items-center md:items-start justify-center gap-4 z-10">
        
        <!-- Left Side Panel (Desktop) / Top Grid Info (Mobile) -->
        <div class="flex md:flex-col gap-3 w-full md:w-44 justify-between order-2 md:order-1">
            <!-- Hold Piece Box -->
            <div class="box-glow rounded-xl p-3 bg-slate-900/80 flex-1 md:flex-none flex flex-col items-center">
                <span class="text-xs text-cyan-400 tracking-wider font-semibold mb-1">HOLD (C)</span>
                <div class="w-20 h-20 md:w-24 md:h-24 flex items-center justify-center">
                    <canvas id="holdCanvas" width="96" height="96"></canvas>
                </div>
            </div>

            <!-- Stats Box -->
            <div class="box-glow rounded-xl p-3 bg-slate-900/80 flex-1 md:flex-none flex flex-col gap-2 font-arcade text-xs">
                <div>
                    <div class="text-slate-400 text-[10px] mb-1">SCORE</div>
                    <div id="scoreText" class="text-cyan-300 text-sm sm:text-base font-bold truncate">0</div>
                </div>
                <div>
                    <div class="text-slate-400 text-[10px] mb-1">HIGH SCORE</div>
                    <div id="highScoreText" class="text-yellow-400 text-sm sm:text-base font-bold truncate">0</div>
                </div>
                <div class="flex justify-between md:flex-col gap-2">
                    <div>
                        <div class="text-slate-400 text-[10px] mb-1">LEVEL</div>
                        <div id="levelText" class="text-pink-400 text-sm sm:text-base font-bold">1</div>
                    </div>
                    <div>
                        <div class="text-slate-400 text-[10px] mb-1">LINES</div>
                        <div id="linesText" class="text-green-400 text-sm sm:text-base font-bold">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Central Game Canvas -->
        <div class="relative order-1 md:order-2 flex justify-center items-center">
            <div class="box-glow-pink p-1.5 rounded-2xl bg-slate-950 relative">
                <canvas id="tetrisCanvas" width="240" height="480" class="block"></canvas>
                
                <!-- Game Over Overlay -->
                <div id="gameOverModal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-xl flex flex-col items-center justify-center gap-4 hidden z-20">
                    <h2 class="text-3xl font-black text-pink-500 glow-pink tracking-wider">GAME OVER</h2>
                    <div class="text-center font-arcade text-xs text-slate-300 leading-relaxed px-4">
                        <p class="mb-2">PUNTUACIÓN FINAL:</p>
                        <p id="finalScoreText" class="text-cyan-400 text-lg mb-4">0</p>
                    </div>
                    <button id="restartBtn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-fuchsia-600 text-white font-bold text-sm tracking-widest shadow-lg hover:brightness-125 transition transform active:scale-95">
                        REINICIAR
                    </button>
                </div>

                <!-- Pause Overlay -->
                <div id="pauseModal" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center gap-4 hidden z-20">
                    <h2 class="text-3xl font-black text-cyan-400 glow-cyan tracking-wider">PAUSA</h2>
                    <p class="text-xs text-slate-400 font-arcade">PRESIONA 'P' O TOCA PARA CONTINUAR</p>
                </div>
            </div>
        </div>

        <!-- Right Side Panel (Next Piece Box) -->
        <div class="w-full md:w-44 order-3 flex justify-center md:block">
            <div class="box-glow rounded-xl p-3 bg-slate-900/80 w-full max-w-[200px] md:max-w-none flex flex-col items-center">
                <span class="text-xs text-cyan-400 tracking-wider font-semibold mb-1">SIGUIENTE</span>
                <div class="w-20 h-20 md:w-24 md:h-24 flex items-center justify-center">
                    <canvas id="nextCanvas" width="96" height="96"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Touch Screen Controls (Mobile Friendly) -->
    <footer class="w-full max-w-md mt-3 grid grid-cols-5 gap-2 z-10 md:hidden pb-2">
        <button id="btnHold" class="btn-touch h-12 flex flex-col text-[10px]"><i class="fas fa-hand text-xs"></i>HOLD</button>
        <button id="btnRotCCW" class="btn-touch btn-touch-action h-12"><i class="fas fa-undo"></i></button>
        <button id="btnRotate" class="btn-touch btn-touch-action h-12"><i class="fas fa-redo"></i></button>
        <button id="btnHardDrop" class="btn-touch btn-touch-action h-12 text-amber-400 border-amber-400"><i class="fas fa-angles-down"></i></button>
        <button id="btnPauseTouch" class="btn-touch h-12 text-xs"><i class="fas fa-pause"></i></button>

        <button id="btnLeft" class="btn-touch h-14 col-span-1"><i class="fas fa-arrow-left"></i></button>
        <button id="btnDown" class="btn-touch h-14 col-span-2"><i class="fas fa-arrow-down"></i></button>
        <button id="btnRight" class="btn-touch h-14 col-span-2"><i class="fas fa-arrow-right"></i></button>
    </footer>

    <script script src="Tetris.js"></script>
        
    </script>
</body>
</html>
